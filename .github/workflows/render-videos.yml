# Renders the video ads for one run on GitHub's runners (5 videos in parallel) and uploads them to Supabase Storage.
# Started by the app (automatically for full runs, or with the "Render videos online" button) through the API,
# or by hand: Actions > Render videos > Run workflow > enter the run id.
#
# Needs these repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, ELEVENLABS_API_KEY
# Optional repository variable: ELEVENLABS_VOICE_ID (the default voice; the app can pick one per render)
# Optional repository secret: N8N_DRIVE_WEBHOOK_URL (copies every finished video to Google Drive through n8n; see SETUP.md)
name: Render videos

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id from the app (shown in the Videos tab)
        required: true
        type: string
      only:
        description: Only these video numbers, e.g. 1,3 (empty = all)
        required: false
        default: ''
        type: string
      voice:
        description: Use the ElevenLabs voiceover ("false" = silent videos with captions)
        required: false
        default: 'true'
        type: string
      voice_id:
        description: ElevenLabs voice id (empty = the default voice)
        required: false
        default: ''
        type: string
      drive_only:
        description: Do not render; only copy the already-rendered videos to Google Drive
        required: false
        default: 'false'
        type: string

concurrency:
  group: render-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  RUN_ID: ${{ inputs.run_id }}
  N8N_DRIVE_WEBHOOK_URL: ${{ secrets.N8N_DRIVE_WEBHOOK_URL }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      folder: ${{ steps.plan.outputs.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: plan
        run: node video/ci/plan.mjs
        env:
          ONLY: ${{ inputs.only }}

  render:
    needs: prepare
    if: inputs.drive_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libxshmfence1 fonts-liberation
      - name: Install dependencies
        working-directory: video
        run: npm install --no-audit --no-fund
      - name: Render video ${{ matrix.n }}
        working-directory: video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id || vars.ELEVENLABS_VOICE_ID }}
        run: node render.mjs "$RUN_ID" --only ${{ matrix.n }} --out out ${{ inputs.voice == 'false' && '--no-voice' || '--require-voice' }}
      - name: Upload to Supabase Storage
        run: node video/ci/upload.mjs "$RUN_ID" video/out
      - name: Copy to Google Drive (through n8n, optional)
        if: env.N8N_DRIVE_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DRIVE_VIDEOS_FOLDER_ID: ${{ needs.prepare.outputs.folder }}
        run: node video/ci/drive.mjs "$RUN_ID" video/out

  drive:
    needs: prepare
    if: inputs.drive_only == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the rendered videos to Google Drive
        env:
          DRIVE_VIDEOS_FOLDER_ID: ${{ needs.prepare.outputs.folder }}
        run: node video/ci/drive.mjs "$RUN_ID" --from-storage --strict

  finish:
    needs: [prepare, render, drive]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record the outcome
        run: node video/ci/finish.mjs
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RENDER_RESULT: ${{ needs.render.result }}
          DRIVE_RESULT: ${{ needs.drive.result }}
          DRIVE_ONLY: ${{ inputs.drive_only }}
