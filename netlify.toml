# Netlify build configuration. Values here override the Netlify UI fields.
[build]
  base = "app"                # the React app and its functions live in /app
  command = "npm run build"   # vite build -> app/dist
  publish = "dist"            # relative to base

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"   # relative to base
  node_bundler = "nft"              # ships node_modules as-is; avoids bundling CommonJS packages into an ES module

# The API function claims /api/* itself (export const config in api.mjs), so no redirects are needed.
# The app has no client-side routes, so there is no single-page-app fallback rule either.
